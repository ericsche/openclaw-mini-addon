configuration:
  timezone:
    name: Timezone
    description: >-
      Timezone used inside the container, for example Europe/Paris.
  gateway_port:
    name: Gateway port
    description: >-
      Port used by the OpenClaw gateway for both the WebSocket API and the
      dashboard. This is also the port exposed on your network.
  gateway_bind_mode:
    name: Bind mode
    description: >-
      Use "lan" to reach the dashboard from your network. "loopback" restricts
      the gateway to the container itself, which makes the exposed port unusable.
  gateway_token:
    name: Gateway auth token
    description: >-
      Shared token required to connect. Leave empty to have one generated on
      first start; retrieve it afterwards with "oc-maint token".
  allowed_origins:
    name: Additional allowed origins
    description: >-
      Comma-separated browser origins allowed to open the Control UI, for
      example http://192.168.1.50:18789. Required when you reach the dashboard
      by IP or hostname, otherwise OpenClaw answers "origin not allowed".
      Loopback and homeassistant.local are always allowed.
  enable_terminal:
    name: Web terminal
    description: >-
      Serve a terminal on the OpenClaw entry in the Home Assistant sidebar,
      through Ingress. This is how you reach the oc-maint commands. Turning it
      off removes the only built-in way to administer the add-on.
  auto_approve_devices:
    name: Auto-approve Control UI browsers
    description: >-
      Approve browser pairing requests automatically instead of running
      "oc-maint approve" by hand. Convenient when you have no shell into this
      container, but it means any browser that can reach the port and knows the
      token gets operator access. Only enable this on a trusted network.
  auto_update:
    name: Update OpenClaw on every start
    description: >-
      Install openclaw@latest each time the add-on starts, before the gateway
      boots. This is the only moment when nothing holds the state lock. Leave
      this off if you prefer updating deliberately with "oc-maint update".

network:
  18789/tcp: OpenClaw gateway (WebSocket API and dashboard)
